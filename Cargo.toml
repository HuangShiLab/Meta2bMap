[package]
name = "meta2bmap"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Coverage-adjusted ANI queries and taxonomic profiling for 2bRAD and shotgun metagenomic data"
repository = "https://github.com/HuangShiLab/Meta2bMap"

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.9"
flate2 = "1.0"
fxhash = "0.2"
glob = "0.3"
itertools = "0.11"
log = "0.4"
memory-stats = "1.0"
needletail = "0.5"
rayon = "1.10"
regex = "1.10"
scalable_cuckoo_filter = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sysinfo = "0.29"
tikv-jemallocator = "0.5"
